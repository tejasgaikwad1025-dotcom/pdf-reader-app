name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential libssl-dev libffi-dev cmake autoconf automake libtool pkg-config
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Build APK
        env:
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "21"
        run: |
          yes | buildozer android debug 2>&1 | tee build.log || true
          cat build.log | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: bin/*.apk
          if-no-files-found: warn